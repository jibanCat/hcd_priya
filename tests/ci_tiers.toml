# Test tiers and levels: how and when CI runs each test file. Every tests/test_*.py, tests/regression/test_*.py,
# tests/integration/test_*.py and tests/external/test_*.py file appears in [files] below exactly once
# (tests/test_ci_tiers.py checks this), in one of two TOML forms that mean the same:
#   "path" = { tier = "...", level = "...", reason = "..." }     one line, for an entry with a few keys;
#   [files."path"]                                                a table, for an entry with long lists, one key
#   tier = "..."                                                  per line (the table ends where the next one
#   level = "..."                                                 starts)
#   asset_tests = ["test_a", "test_b"]
#
# Two words that sound alike; every file has both:
# - The TIER says HOW a file runs: the wheel tier from a directory holding only tests/, so the code under test is the
#   installed package; the source tier from the checkout (the file also needs scripts/, docs/ or git); the other
#   tiers ([tiers] below) never run in CI.
# - The LEVEL says WHEN it runs:
#   pr       every pull request and every push to main (.github/workflows/tests.yml, the supported pinned stack);
#   nightly  the pr tests and these, once a day and by hand, on the pinned and the two newer-dependency stacks
#            (.github/workflows/nightly.yml);
#   release  only where the real assets are: the assets job before a release (tools/ci/run_test_tier.py --tier
#            assets), whose record is attached to the release (docs/release_checklist.md); the release validation
#            workflow lists these tests;
#   not run  never (no test to collect, all deferred, or an optional reference environment).
# A stack is one Python version with one set of dependency versions; the pinned stack, Python 3.11 with the exact
# versions of tools/ci/constraints-devenv.txt, is the only supported one.
# Single tests can differ from their file's level, by name. Each key names where its tests run, which is NOT the
# level of the file that carries it:
#   pr_tests       in a nightly file: these tests also run at pr;
#   nightly_tests  in a pr file: these tests run at nightly only;
#   release_tests  in a pr or nightly file: they need an asset and fail rather than skip without it, so CI leaves them
#                  out and the assets job runs them.
# An asset is a large or private file that CI does not have: a data cache, trained models, observational data, raw
# simulation outputs. Three names in the reasons below:
#   D5 integration data  the real release data that the tests in tests/integration/ read, through the JSON
#                        configuration named by HCD_D5_INTEGRATION_CONFIG (tests/integration/_config.py; "D5" is the
#                        project's name for the step that added those tests);
#   MF integration data  the release's multi-fidelity (MF) correction record and its inputs, through the JSON
#                        configuration named by HCD_MF_INTEGRATION_CONFIG (tests/integration/test_mf_release_real.py);
#   fake_spectra         the separately installed package that computes spectra from simulation snapshots
#                        (docs/fake_spectra_integration.md).
# Other project words in the reasons and file names:
#   HCD           high-column-density absorbers (README.md); also the prefix of the environment variables;
#   P1D           the one-dimensional flux power spectrum of the Lyman-alpha forest, the measured data (README.md);
#   leg           one P1D measurement used in a fit (DESI, KODIAQ-SQUAD or eBOSS), with its own covariance;
#   nightly gate  tools/ci/nightly_gate.py: it refuses a release unless the latest nightly run on its commit passed;
#   invariant     a scientific check that must run on every pull request (PR_INVARIANTS, tests/test_ci_tiers.py);
#   LF            low fidelity: the low-resolution PRIYA simulations; "the LF training cache" is built from them.
#
# Skipped is not passed. tools/ci/run_test_tier.py runs one tier at one level, one pytest process per file. In CI:
#   a skip of a test not named in asset_tests or skipped_by_design   the file FAILS;
#   a skip of a test named there                                      allowed: reported as NOT RUN, never as passed;
#   a test named there that runs instead of skipping                  the file FAILS (the list is stale);
#   a test named in release_tests                                     not skipped: CI leaves it out (deselects it);
#   an expected failure that is not an exact deferral                 the file FAILS (deferrals: the deferred_legacy
#                                                                     causes in tests/DEFERRED.md, or deferred_xfails).
# A file also fails on any failure or error, and when none of its tests passes. Tests marked slow are deselected and
# listed. reason says why a file or test is not run in CI or runs at another level. The level "not run" (never run in
# CI) is not the runner's report label NOT RUN (not run in that run).
# How the entries were set: the tiers from a run of every file without the real assets, corrected after an
# AI-assisted review; the levels file by file, then checked by an audit (2026-11-17, written up in pull request #28)
# of the scientific checks that must run on every pull request, now listed in PR_INVARIANTS in tests/test_ci_tiers.py.

[tiers]
wheel = "fixture and synthetic tests of the installed package; CI runs them from a directory holding only tests/"
source = "fixture and synthetic tests that also need repository files (scripts/, docs/, a git checkout); CI runs them from the checkout"
assets = "the file cannot run in CI: its tests need a real asset that CI does not have (a cache, trained members, observational data, raw simulation outputs, the private notes, or fake_spectra), and without it some fail rather than skip, or none passes; tests in it that need no asset are not run in CI either"
deferred = "no test of the file passes in CI: each is an explicit deferral (tests/DEFERRED.md) or needs a real asset; not run in CI"
external = "tests/external: optional tests in a reference environment of their own; not run in CI"
no_tests = "a file named test_*.py from which pytest collects no test; not run in CI"

[levels]
pr = "every pull request and push to main: the supported pinned job"
nightly = "once a day and by hand: the pr level and these files, on the pinned and the two newer-dependency stacks"
release = "only with the real assets, before a release (the assets job); listed by the release validation workflow"
"not run" = "never: no test to collect, all deferred, or an optional reference environment"

