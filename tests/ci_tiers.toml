# Test tiers (B.2). Every tests/test_*.py, tests/regression/test_*.py, tests/integration/test_*.py and
# tests/external/test_*.py file appears here exactly once (tests/test_ci_tiers.py checks this). CI
# (.github/workflows/tests.yml) runs the wheel and source tiers with tools/ci/run_test_tier.py, which fails a file
# on any failure, error, undeclared skip or
# undeclared expected failure, or when no test passes. asset_tests and skipped_by_design name the only tests
# allowed to skip there; they are reported as NOT RUN, never as passed, and must skip (a declared test that runs
# fails its file). Expected failures are allowed only as exact deferrals: the deferred_legacy causes of
# tests/gate_helpers.py, or the messages a file lists in deferred_xfails. reason says why, for every test or file
# that CI does not run; tests marked slow are deselected and listed by the runner. Classified from a run with no
# data links and the private trees hidden, and corrected after an AI-assisted review.

[tiers]
wheel = "fixture and synthetic tests of the installed package; CI runs them from a directory holding only tests/"
source = "fixture and synthetic tests that also need repository files (scripts/, docs/, a git checkout); CI runs them from the checkout"
assets = "the file cannot run in CI: its tests need a real asset that CI does not have (a cache, trained members, observational data, raw simulation outputs, the private notes, or fake_spectra), and without it some fail rather than skip, or none passes; tests in it that need no asset are not run in CI either"
deferred = "no test of the file passes in CI: each is an explicit deferral (tests/DEFERRED.md) or needs a real asset; not run in CI"
external = "tests/external: optional tests in a reference environment of their own; not run in CI"
no_tests = "a file named test_*.py from which pytest collects no test; not run in CI"

