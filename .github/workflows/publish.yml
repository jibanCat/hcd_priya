# Publishing the two packages to the package index: hcd-priya-models (the trained models) and hcd-priya (the code).
#
# ENABLED, AND MANUAL. What stands between a start of this workflow and an upload:
#   - it starts only by hand (workflow_dispatch): no push, tag or release starts it;
#   - the build job refuses to go on unless the latest nightly run on the commit passed (tools/ci/nightly_gate.py);
#   - an upload to the real index starts only from the tag of this version (v<version>), and only when the release
#     date is written in CHANGELOG.md and CITATION.cff: the build job checks both, and the two environments of the
#     real index accept tags v* only;
#   - the publish job runs in a protected environment of this repository with a required reviewer, so every upload
#     waits for the maintainer's approval. There is one environment per package and index, because the index
#     allows only one pending trusted publisher per owner, repository, workflow and environment:
#         hcd-priya-models:  testpypi-models, pypi-models          hcd-priya:  testpypi, pypi
#   - the upload action is pinned to a commit, not to a branch.
# The order of a release is in docs/release_checklist.md: the test index first, the model package before the code
# package, each step on the maintainer's approval. An upload to the index cannot be replaced or withdrawn.
#
# How it works:
#   - "trusted publishing": the index accepts an upload from this workflow of this repository in the environment
#     named there, identified by a short-lived token that GitHub issues to the job (id-token: write). No password
#     or API token is stored.
#   - the model package is built from an accepted release that is NOT in git. The release archive is given by its
#     URL and its sha256; model_package/prepare.py checks the sha256 of release.json and verifies every file before
#     anything is built. The reference predictions published beside the release are given the same way (URL and
#     sha256); the fresh install compares the installed model's predictions with them (check_release --reference).
#     Both files are on the GitHub release of the version, which is created first, as a pre-release:
#         https://github.com/jibanCat/hcd_priya/releases/download/v<version>/hcd_priya_lfmf_release_<version>.tar.gz
#         https://github.com/jibanCat/hcd_priya/releases/download/v<version>/reference_predictions.json
#   - a model package built with a synthetic bundle (version X.Y.Z+synthetic) cannot be uploaded: the index refuses
#     a version with a local label.
name: publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Which package to publish
        type: choice
        options: [hcd-priya-models, hcd-priya]
        required: true
      index:
        description: The test index first; the real index only after the dry run
        type: choice
        options: [testpypi, pypi]
        default: testpypi
        required: true
      release_archive_url:
        description: "hcd-priya-models only: https URL of the release archive on the GitHub release of the version (hcd_priya_lfmf_release_<version>.tar.gz)"
        required: false
      release_archive_sha256:
        description: "hcd-priya-models only: sha256 of that archive"
        required: false
      release_sha256:
        description: "hcd-priya-models only: sha256 of the release's release.json"
        required: false
      reference_url:
        description: "hcd-priya-models only: https URL of reference_predictions.json on the same GitHub release"
        required: false
      reference_sha256:
        description: "hcd-priya-models only: sha256 of that reference file"
        required: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ inputs.package }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Nightly failures block a release: the latest nightly run on this commit must have passed. The repository is
      # public, so the runs are read without a token and this workflow keeps its permissions as they are. An
      # anonymous request can meet GitHub's rate limit on a shared runner: that is a refusal, never a pass; run again.
      - name: The latest nightly run on this commit passed
        run: python tools/ci/nightly_gate.py --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA"
      # An upload to the index cannot be replaced: it is made from the tag of this version and from nothing else,
      # and only when the release date is written (the placeholder RELEASE_DATE is gone from both files).
      # The test index takes any ref, so that a rehearsal can be made before or from the tag.
      - name: The real index takes the tag of this version only, with its release date written
        if: ${{ inputs.index == 'pypi' }}
        run: |
          version="$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('hcd_analysis/__init__.py').read()).group(1))")"
          if [ "$GITHUB_REF" != "refs/tags/v$version" ]; then
            echo "an upload to the index starts from the tag v$version, not from $GITHUB_REF"
            exit 1
          fi
          if grep -n "RELEASE_DATE" CHANGELOG.md CITATION.cff; then
            echo "the release date is still the placeholder RELEASE_DATE (the lines above): write the day of publication first"
            exit 1
          fi
      - name: Build the code package
        if: ${{ inputs.package == 'hcd-priya' }}
        run: |
          python -m pip install build
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" python -m build --outdir dist .
          python tools/ci/check_dist.py dist
          python tools/ci/check_dist_content.py dist --release
      - name: Build the model package from the accepted release
        if: ${{ inputs.package == 'hcd-priya-models' }}
        env:
          ARCHIVE_URL: ${{ inputs.release_archive_url }}
          ARCHIVE_SHA256: ${{ inputs.release_archive_sha256 }}
          RELEASE_SHA256: ${{ inputs.release_sha256 }}
          REFERENCE_URL: ${{ inputs.reference_url }}
          REFERENCE_SHA256: ${{ inputs.reference_sha256 }}
        run: |
          case "$ARCHIVE_URL" in https://*) ;; *) echo "the release archive must be an https URL"; exit 1;; esac
          case "$REFERENCE_URL" in https://*) ;; *) echo "the reference predictions must be an https URL"; exit 1;; esac
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/reference_predictions.json" "$REFERENCE_URL"
          echo "$REFERENCE_SHA256  $RUNNER_TEMP/reference_predictions.json" | sha256sum --check
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/release.tar.gz" "$ARCHIVE_URL"
          echo "$ARCHIVE_SHA256  $RUNNER_TEMP/release.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/release" && tar -xzf "$RUNNER_TEMP/release.tar.gz" -C "$RUNNER_TEMP/release" --strip-components=1
          # the code that verifies the release: this commit's hcd_analysis, with its dependencies but not the model package
          python -m pip install build
          python -m build --wheel --outdir "$RUNNER_TEMP/code" .
          python tools/ci/wheel_requires.py "$(ls "$RUNNER_TEMP"/code/*.whl)" --without hcd-priya-models > "$RUNNER_TEMP/requirements.txt"
          python -m pip install -c tools/ci/constraints-devenv.txt -r "$RUNNER_TEMP/requirements.txt"
          python -m pip install --no-deps "$(ls "$RUNNER_TEMP"/code/*.whl)"
          # the release holds an examples folder that release.json does not name: it is named here, or prepare.py stops
          python model_package/prepare.py --release "$RUNNER_TEMP/release" --release-sha256 "$RELEASE_SHA256" \
            --allow-extra examples
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" python -m build --outdir dist model_package
          python tools/ci/check_dist_content.py dist --release
          ls -l dist && sha256sum dist/*
          # The blocking fresh install: only the two wheels, no test switch. It passes only if this commit's
          # hcd_analysis/published_models.py holds the entry of the release that was just built.
          python -m venv "$RUNNER_TEMP/fresh"
          "$RUNNER_TEMP/fresh/bin/python" -m pip install -c tools/ci/constraints-devenv.txt \
            "$(ls "$RUNNER_TEMP"/code/*.whl)" "$(ls dist/*.whl)"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/fresh/bin/python" -I "$GITHUB_WORKSPACE/tools/ci/readme_first_example.py" \
            "$GITHUB_WORKSPACE/README.md"
          "$RUNNER_TEMP/fresh/bin/python" -I -m hcd_analysis.check_release --published \
            --reference "$RUNNER_TEMP/reference_predictions.json"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ inputs.package }}
          path: dist
          retention-days: 7

  publish:
    name: Publish ${{ inputs.package }} to ${{ inputs.index }}
    needs: build
    runs-on: ubuntu-24.04
    # one protected environment per package and index: testpypi-models, pypi-models, testpypi, pypi
    environment: ${{ inputs.package == 'hcd-priya-models' && format('{0}-models', inputs.index) || inputs.index }}
    permissions:
      id-token: write  # trusted publishing: the index checks this job's identity; no stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ inputs.package }}
          path: dist
      - name: Publish to the test index
        if: ${{ inputs.index == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to the index
        if: ${{ inputs.index == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
